name: Check Aachen Termin

on:
  schedule:
    # Backup only: GitHub's scheduler barely fires for this repo, so the main
    # trigger is cron-job.org calling workflow_dispatch (see README).
    # Every 5 minutes, offset to :02/:07/... because GitHub delays or drops more
    # runs at :00. Cron is UTC, so 4-20 covers 06:00-22:00 Berlin in both summer
    # and winter time; check.py skips runs outside 06:00-22:00 Berlin.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 4-20 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification instead of checking"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: termin-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Check out the newest main, not the commit at trigger time, so a queued
      # run sees the state.json the previous run just pushed.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run checker
        env:
          BEFORE_DATE: ${{ vars.BEFORE_DATE || '2026-12-23' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python check.py --test-notify
          else
            python check.py
          fi

      - name: Save state / keep repo active
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "termin-bot"
          git config user.email "termin-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "Update notified dates"
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 30 * 86400 )) ]; then
            # GitHub disables scheduled workflows after 60 days without repo activity.
            git commit --allow-empty -m "Keepalive"
          else
            exit 0
          fi
          git push
